[package]
name = "ee_web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Browser UI for EtherCAT EMI"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
ee_core = { path = "../ee_core" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "console", "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "Navigator", "NodeList", "CssStyleDeclaration",
  "DomRect", "DomTokenList", "MediaQueryList", "Node", "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent",
  "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation",
  "WebGlVertexArrayObject", "WebGlContextAttributes",
  "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url", "DragEvent", "DataTransfer",
  "HtmlAnchorElement", "Location", "History",
]
